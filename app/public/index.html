<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Forge</title>
  <meta name="description" content="Forge d'armes en ligne">

  <link rel="stylesheet" href="/style/destyle.css">
  <link rel="stylesheet" href="/style/variables.css">
  <link rel="stylesheet" href="/style/font.css">

  <link rel="stylesheet" href="/style/header.css">
  <link rel="stylesheet" href="/style/table.css">
  <link rel="stylesheet" href="/style/form.css">
  <link rel="stylesheet" href="/style/footer.css">
  
  <script src="/script/raffraichissement.js" defer></script>
  <script src="/script/forge.js" defer></script>
</head>
<body>
  <header>
    <h1>Forge</h1>
  </header>
  
  <main>
    <section>
      <h2>Armes</h2>
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Type</th>
            <th>Composant</th>
          </tr>
        </thead>
        <tbody id="liste"></tbody>
      </table>
    </section>

    <section>
        <h2>Forger une arme</h2>
      <form id="formulaire">
        <input name="nom" type="text" placeholder="Nom" required>
        <input name="type" type="text" placeholder="épée, hache, batte" required>
        <input name="composant" type="text" placeholder="bois, acier, mithril" required>
        <button type="submit">Forger</button>
      </form>
      <p id="message"></p>
    </section>
  </main>

  <footer>
    <p>Assistance : forgeron.online@gmail.com</p>
    <p>© 2026 Forgeron. Tous droits réservés.</p>
  </footer>
</body>
</html>
