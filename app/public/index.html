<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge</title>
  <link rel="stylesheet" href="/style/main.css">
  <script src="/script/script.js" defer></script>
</head>
<body>
  <h1>Forge</h1>

  <section>
    <h2>Armes</h2>
    <table>
      <thead>
        <tr>
          <th>Nom</th>
          <th>Type</th>
          <th>Composant</th>
        </tr>
      </thead>
      <tbody id="liste">
        <tr>
          <td colspan="4">Chargement...</td>
        </tr>
      </tbody>
    </table>
  </section>


  <h2>Forger une arme</h2>
  <form id="formulaire">
    <input name="nom" type="text" placeholder="Nom" required>
    <input name="type" type="text" placeholder="épée, hache, batte" required>
    <input name="composant" type="text" placeholder="bois, acier, mithril" required>
    <button type="submit">Forger</button>
  </form>
  <p id="message"></p>
</body>
</html>
