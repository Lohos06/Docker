name: forge
services:
  api:
    container_name: forge-api
    build: ./app
    ports:
      - "8000:3000"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    depends_on:
      - db
    restart: 
      on-failure

  db:
    container_name: forge-db
    image: postgres:18-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - forge:/var/lib/postgresql/18/docker

  adminer:
    container_name: forge-adminer
    image: adminer:6.3.0
    restart: always
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./adminer-prefill.php:/var/www/html/plugins-enabled/prefill.php:ro
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  forge: